<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 用户浏览器 -->
  <rect x="280" y="10" width="160" height="44" rx="8" fill="#bfdbfe" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="37" text-anchor="middle" font-size="14" font-weight="600" fill="#172033">🌐 用户浏览器</text>

  <!-- 箭头：浏览器 → Caddy -->
  <line x1="360" y1="54" x2="360" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="76" font-size="11" fill="#5b6475">HTTPS :443</text>

  <!-- 阿里云服务器外框 -->
  <rect x="40" y="90" width="640" height="220" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="60" y="112" font-size="13" font-weight="600" fill="#5b6475">☁️ 阿里云轻量应用服务器 (Ubuntu 24.04)</text>

  <!-- Caddy -->
  <rect x="100" y="130" width="220" height="70" rx="8" fill="#c7d2fe" stroke="#64748b" stroke-width="1.5"/>
  <text x="210" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">Caddy</text>
  <text x="210" y="178" text-anchor="middle" font-size="11" fill="#5b6475">:443 自动 HTTPS</text>
  <text x="210" y="192" text-anchor="middle" font-size="11" fill="#5b6475">Let's Encrypt 证书</text>

  <!-- frps -->
  <rect x="400" y="130" width="220" height="70" rx="8" fill="#c7d2fe" stroke="#64748b" stroke-width="1.5"/>
  <text x="510" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">frps</text>
  <text x="510" y="178" text-anchor="middle" font-size="11" fill="#5b6475">:7000 接受连接</text>
  <text x="510" y="192" text-anchor="middle" font-size="11" fill="#5b6475">:8080 子域名路由</text>

  <!-- 箭头：Caddy → frps -->
  <line x1="320" y1="165" x2="400" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="157" text-anchor="middle" font-size="10" fill="#5b6475">反向代理</text>

  <!-- 箭头：frps → 树莓派 -->
  <line x1="510" y1="200" x2="510" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
  <text x="530" y="265" font-size="11" fill="#5b6475">TLS 加密隧道</text>
  <text x="530" y="279" font-size="11" fill="#5b6475">frp v0.70.0</text>

  <!-- 树莓派外框 -->
  <rect x="40" y="330" width="640" height="170" rx="12" fill="#ecfdf5" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="60" y="352" font-size="13" font-weight="600" fill="#5b6475">🍓 树莓派 4B (Raspberry Pi OS, 局域网)</text>

  <!-- frpc -->
  <rect x="100" y="370" width="200" height="70" rx="8" fill="#bbf7d0" stroke="#64748b" stroke-width="1.5"/>
  <text x="200" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">frpc</text>
  <text x="200" y="418" text-anchor="middle" font-size="11" fill="#5b6475">连接 frps</text>
  <text x="200" y="432" text-anchor="middle" font-size="11" fill="#5b6475">暴露本地服务</text>

  <!-- SSH 服务 -->
  <rect x="370" y="370" width="140" height="50" rx="8" fill="#fef9c3" stroke="#64748b" stroke-width="1.5"/>
  <text x="440" y="393" text-anchor="middle" font-size="13" font-weight="600" fill="#172033">SSH</text>
  <text x="440" y="410" text-anchor="middle" font-size="11" fill="#5b6475">:22 → 20022</text>

  <!-- Web 服务 -->
  <rect x="540" y="370" width="140" height="50" rx="8" fill="#fef9c3" stroke="#64748b" stroke-width="1.5"/>
  <text x="610" y="393" text-anchor="middle" font-size="13" font-weight="600" fill="#172033">Web 服务</text>
  <text x="610" y="410" text-anchor="middle" font-size="11" fill="#5b6475">子域名代理</text>

  <!-- 箭头：frpc → SSH -->
  <line x1="300" y1="395" x2="370" y2="395" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- 箭头：frpc → Web -->
  <line x1="300" y1="410" x2="540" y2="410" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 底部流量路径 -->
  <rect x="120" y="470" width="480" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="360" y="493" text-anchor="middle" font-size="12" fill="#172033">流量路径：浏览器 → Caddy (HTTPS) → frps (TLS) → frpc → 树莓派服务</text>
</svg>
